<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RUNE · Laboratorio voxel</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23030406'/%3E%3Cpath d='M3 6l5-3 5 3v5l-5 3-5-3z' fill='%237dffb0'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="./lab.css" />
  </head>
  <body>
    <header>
      <div class="title"><b>Laboratorio voxel</b> <span class="dim">MarkovJunior 3D → sprite in 3/4 · sperimentale, fuori dal gioco</span></div>
      <label>universo <select id="universe"></select></label>
      <label>modello <input id="model" list="model-list" size="22" /></label>
      <datalist id="model-list">
        <option value="gemini-3.5-flash"></option>
        <option value="gemini-3.1-flash-lite"></option>
        <option value="gemini-3.8-flash"></option>
        <option value="gemini-3.1-pro-preview"></option>
      </datalist>
      <span id="mode" class="badge"></span>
      <span id="usage" class="dim"></span>
      <a href="/" class="dim">← gioco</a>
    </header>

    <aside id="targets">
      <div class="tabs" id="steps"></div>
      <input id="filter" placeholder="cerca…" />
      <div id="list"></div>
      <details id="custom">
        <summary>nuovo bersaglio</summary>
        <input id="c-name" placeholder="nome (es. Lanterna di ferro)" />
        <textarea id="c-desc" rows="3" placeholder="descrizione"></textarea>
        <button id="c-add">aggiungi</button>
      </details>
      <div class="foot">
        <button id="batch" title="scolpisce tutti i bersagli della scheda">scolpisci la scheda</button>
        <button id="export">esporta risultati</button>
      </div>
    </aside>

    <main id="main">
      <p class="dim">Scegli un bersaglio a sinistra.</p>
    </main>

    <section id="feed"></section>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
