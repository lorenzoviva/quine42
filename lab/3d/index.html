<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RUNE · sandbox 3D</title>
    <link rel="stylesheet" href="./sandbox.css" />
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="hud">
      <b>RUNE · sandbox 3D</b> — tutto ciò che vedi è generato da programmi MarkovJunior
      <div class="keys">WASD muovi · Shift corri · Q/R ruota · rotella zoom · tasto destro trascina: orbita · E agisci · clic su un modello: ispeziona</div>
      <div id="status">preparo il mondo…</div>
    </div>
    <div id="prompt" hidden></div>
    <aside id="panel">
      <section>
        <h2>Mondo</h2>
        <label>seme <input id="world-seed" type="number" value="7" min="1" /></label>
        <button id="world-new">Rigenera</button>
        <label>ora <input id="hour" type="range" min="0" max="24" step="0.1" value="10" /> <span id="hour-v">10:00</span></label>
        <label>vento <input id="wind" type="range" min="0" max="0.2" step="0.005" value="0.05" /></label>
        <div id="stats" class="small"></div>
      </section>
      <section>
        <h2>Modelli</h2>
        <div id="models"></div>
      </section>
      <section id="inspector" hidden>
        <h2 id="ins-name"></h2>
        <div id="ins-source" class="small"></div>
        <div class="row">
          <button id="ins-show">Mettilo davanti a me</button>
          <button id="ins-seed">Nuovo seme</button>
          <button id="ins-grow">Cresci</button>
        </div>
        <div id="ins-info" class="small"></div>
        <textarea id="ins-xml" spellcheck="false"></textarea>
        <div class="row"><button id="ins-run">Esegui l'XML</button> <span id="ins-err" class="err"></span></div>
      </section>
    </aside>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
